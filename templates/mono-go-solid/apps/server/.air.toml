tmp_dir = "dist/dev"

[build]
cmd = "go build -o ./dist/dev/server ."
entrypoint = ["./dist/dev/server"]
include_ext = ["go"]
exclude_dir = ["dist", "node_modules", "vendor"]
stop_on_error = true

[build.windows]
cmd = "go build -o ./dist/dev/server.exe ."
entrypoint = ["./dist/dev/server.exe"]

[misc]
clean_on_exit = true
