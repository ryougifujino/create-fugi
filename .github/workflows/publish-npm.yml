name: Publish to npm

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Validate release
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const subject = (process.env.COMMIT_MESSAGE ?? '').split(/\r?\n/, 1)[0].trim();
          const prefix = 'chore: release v';
          const expectedSubject = `${prefix}${pkg.version}`;
          const semver =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/;

          if (!semver.test(pkg.version)) {
            console.error(`Package version is not valid semver: ${pkg.version}`);
            process.exit(1);
          }

          if (subject !== expectedSubject) {
            console.error(`Expected release commit subject: ${expectedSubject}`);
            process.exit(1);
          }

          const releaseTag = `v${pkg.version}`;
          execFileSync(
            'git',
            ['fetch', '--force', 'origin', `refs/tags/${releaseTag}:refs/tags/${releaseTag}`],
            { stdio: 'inherit' },
          );

          const tagCommit = execFileSync('git', ['rev-parse', `${releaseTag}^{commit}`], {
            encoding: 'utf8',
          }).trim();
          if (tagCommit !== process.env.GITHUB_SHA) {
            console.error(
              `Release tag ${releaseTag} points to ${tagCommit}, expected ${process.env.GITHUB_SHA}`,
            );
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          EOF

      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: release-package-${{ github.sha }}
          path: release-package

      - name: Ensure version is not already published
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "create-fugi@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "create-fugi@$RELEASE_VERSION is already published."
            exit 1
          fi

      - name: Publish package
        shell: bash
        run: |
          shopt -s nullglob
          packages=(./release-package/*.tgz)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one release package, found ${#packages[@]}."
            exit 1
          fi
          npm publish "${packages[0]}" --access public --ignore-scripts
