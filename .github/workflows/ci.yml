name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'chore: release v') && github.sha || 'default' }}"
  cancel-in-progress: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm fmt:check

      - name: Typecheck and test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack release
        if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v') }}"
        run: npm pack --ignore-scripts

      - name: Upload release package
        if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v') }}"
        uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ github.sha }}
          path: create-fugi-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: test
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v') }}"
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
